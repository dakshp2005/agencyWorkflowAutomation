<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Agency Workflow Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <style>
      body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .login-card { background: white; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 450px; width: 100%; padding: 3rem; }
      .logo-section { text-align: center; margin-bottom: 2rem; }
      .logo-icon { font-size: 4rem; color: #667eea; }
      .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25); }
      .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 0.75rem; font-weight: 600; }
      .btn-login:hover { background: linear-gradient(135deg, #5a6fd6 0%, #6a4291 100%); }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo-section">
        <i class="bi bi-rocket-takeoff logo-icon"></i>
        <h2 class="mt-3">Agency Workflow</h2>
        <p class="text-muted">Sign in to your account</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary btn-login">Sign In</button>
        </div>
        <div class="text-center">
          <a href="#" class="text-muted" data-bs-toggle="modal" data-bs-target="#registerModal">Create account</a>
        </div>
      </form>
      <div id="alertContainer" class="mt-3"></div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="registerForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Company Name *</label>
                  <input type="text" class="form-control" id="reg_company_name" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Company Email *</label>
                  <input type="email" class="form-control" id="reg_company_email" required />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Company Type/Industry</label>
                <input type="text" class="form-control" id="reg_company_type" placeholder="e.g., Digital Marketing Agency, SaaS, Consulting" />
              </div>
              <div class="mb-3">
                <label class="form-label">Company Description</label>
                <textarea class="form-control" id="reg_company_description" rows="2" placeholder="Describe what your company does"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Your Role/Position</label>
                <input type="text" class="form-control" id="reg_user_role" placeholder="e.g., Account Manager, Sales Director, CEO" />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Password *</label>
                  <input type="password" class="form-control" id="reg_password" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Confirm Password *</label>
                  <input type="password" class="form-control" id="reg_password_confirm" required />
                </div>
              </div>
              <div id="registerAlertContainer"></div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Create Account</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (response.ok) {
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = "/dashboard";
          } else {
            showAlert(data.error || "Login failed", "danger");
          }
        } catch (error) {
          showAlert("An error occurred. Please try again.", "danger");
        }
      });

      document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const password = document.getElementById("reg_password").value;
        const passwordConfirm = document.getElementById("reg_password_confirm").value;
        if (password !== passwordConfirm) {
          showRegisterAlert("Passwords do not match", "danger");
          return;
        }
        const formData = {
          company_name: document.getElementById("reg_company_name").value,
          company_email: document.getElementById("reg_company_email").value,
          company_type: document.getElementById("reg_company_type").value,
          company_description: document.getElementById("reg_company_description").value,
          user_role: document.getElementById("reg_user_role").value,
          password: password,
        };
        try {
          const response = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });
          const data = await response.json();
          if (response.ok) {
            showRegisterAlert("Account created successfully! Please login.", "success");
            setTimeout(() => {
              bootstrap.Modal.getInstance(document.getElementById("registerModal")).hide();
              document.getElementById("registerForm").reset();
            }, 2000);
          } else {
            showRegisterAlert(data.error || "Registration failed", "danger");
          }
        } catch (error) {
          showRegisterAlert("An error occurred. Please try again.", "danger");
        }
      });

      function showAlert(message, type) {
        document.getElementById("alertContainer").innerHTML =
          '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' + message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
      }
      function showRegisterAlert(message, type) {
        document.getElementById("registerAlertContainer").innerHTML =
          '<div class="alert alert-' + type + ' alert-dismissible fade show mb-3" role="alert">' + message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
      }
    </script>
  </body>
</html>
