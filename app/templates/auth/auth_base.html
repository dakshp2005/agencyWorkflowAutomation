<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Agency Automation{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components.css') }}"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg-secondary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse 80% 60% at 20% 0%,
            rgba(37, 99, 235, 0.08) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 50% at 80% 100%,
            rgba(37, 99, 235, 0.06) 0%,
            transparent 60%
          );
        pointer-events: none;
        z-index: 0;
      }

      .auth-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
      }

      /* Branding */
      .auth-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
        text-align: center;
      }

      .auth-brand-icon {
        width: 48px;
        height: 48px;
        background: var(--accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        margin-bottom: 0.25rem;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      }

      .auth-brand-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }

      .auth-brand-sub {
        font-size: 0.8rem;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* Card */
      .auth-card {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.07),
          0 1px 3px rgba(0, 0, 0, 0.05);
      }

      .auth-card-header {
        margin-bottom: 1.75rem;
        text-align: center;
      }

      .auth-card-title {
        font-size: 1.375rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .auth-card-subtitle {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 0.375rem;
      }

      /* Form */
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.125rem;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }

      .auth-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 0.01em;
      }

      .auth-input-wrap {
        position: relative;
      }

      .auth-input-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
        display: flex;
        align-items: center;
      }

      .auth-input {
        width: 100%;
        padding: 0.625rem 0.875rem 0.625rem 2.375rem;
        font-size: 0.875rem;
        font-family: var(--font-sans);
        color: var(--text-primary);
        background: var(--bg-secondary);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s;
      }

      .auth-input::placeholder {
        color: var(--text-muted);
      }

      .auth-input:focus {
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .auth-hint {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 0.125rem;
      }

      /* Submit button */
      .auth-btn {
        width: 100%;
        padding: 0.6875rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        font-family: var(--font-sans);
        color: #ffffff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.1s;
        letter-spacing: 0.01em;
        margin-top: 0.5rem;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      }

      .auth-btn:hover {
        background: var(--accent-hover);
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        transform: translateY(-1px);
      }

      .auth-btn:active {
        transform: translateY(0);
      }

      /* Divider */
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.25rem 0;
      }

      .auth-divider::before,
      .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .auth-divider span {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      /* Footer link */
      .auth-footer {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        color: var(--text-secondary);
      }

      .auth-footer a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      .auth-footer a:hover {
        text-decoration: underline;
      }

      /* Alerts */
      .auth-alert {
        padding: 0.625rem 0.875rem;
        border-radius: 8px;
        font-size: 0.8125rem;
        margin-bottom: 0.25rem;
      }

      .auth-alert-danger {
        background: var(--danger-light);
        color: var(--danger);
        border: 1px solid rgba(220, 38, 38, 0.2);
      }

      .auth-alert-success {
        background: var(--success-light);
        color: var(--success);
        border: 1px solid rgba(22, 163, 74, 0.2);
      }

      .auth-alert-warning {
        background: var(--warning-light);
        color: var(--warning);
        border: 1px solid rgba(217, 119, 6, 0.2);
      }

      .auth-alert-info {
        background: var(--accent-light);
        color: var(--accent);
        border: 1px solid rgba(37, 99, 235, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <i data-lucide="zap" style="width: 22px; height: 22px"></i>
        </div>
        <span class="auth-brand-name">Autsy</span>
        <span class="auth-brand-sub">Automation Platform</span>
      </div>

      {% block content %}{% endblock %}
    </div>

    <script>
      lucide.createIcons();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
