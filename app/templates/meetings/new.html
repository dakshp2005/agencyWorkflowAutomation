{% extends "base.html" %}

{% block page_title %}Create Meeting | Agency Automation{% endblock %}
{% block page_header %}Create New Meeting{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header border-bottom">
        <span>Schedule a New Meeting</span>
    </div>
    <div class="card-body">
        <form action="{{ url_for('meetings.create') }}" method="post">
            <div class="form-group">
                <label for="client_id">Client *</label>
                <select name="client_id" id="client_id" class="form-control" required>
                    <option value="">-- Select a Client --</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}" {% if request.args.get('client_id') == client.id|string %}selected{% endif %}>
                        {{ client.name }} - {{ client.company }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="agenda">Meeting Agenda *</label>
                <textarea name="agenda" id="agenda" class="form-textarea" rows="5" required 
                    placeholder="Enter the purpose and topics to be discussed in the meeting..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="proposed_slots">Proposed Time Slots (Optional)</label>
                <input type="text" name="proposed_slots" id="proposed_slots" class="form-control" 
                    placeholder="e.g., 2026-03-10T14:00, 2026-03-11T10:00, 2026-03-12T15:00">
                <small style="color: var(--text-secondary); font-size: 0.875rem;">
                    Enter comma-separated date-time values in ISO format (YYYY-MM-DDTHH:MM)
                </small>
            </div>
            
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="calendar-plus"></i> Create Meeting
                </button>
                <a href="{{ url_for('meetings.index') }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
