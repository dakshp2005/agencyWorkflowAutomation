<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-title">{% block page_header %}Dashboard{% endblock %}</div>
    </div>
    <div class="topbar-right">
        <div style="position:relative;">
            <i data-lucide="bell"></i>
            <span class="badge badge-pending" id="pending-badge"
                style="position:absolute; top:-8px; right:-12px; display:none; padding: 2px 6px;">0</span>
        </div>
        <div
            style="width: 32px; height: 32px; border-radius: 50%; background: var(--border); display:flex; align-items:center; justify-content:center;">
            <i data-lucide="user" style="width: 16px; height: 16px;"></i>
        </div>
        <a href="{{ url_for('auth.logout') }}" title="Logout"
            style="text-decoration:none; color:var(--text-muted); margin-left:8px; display:flex; align-items:center;">
            <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
        </a>
    </div>
</div>
